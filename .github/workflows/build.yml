name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # WebView2Loader.dll：exe 静态导入该 DLL（见 src-tauri/nsis-hooks.nsh），
      # 但它是二进制不入库 → Windows 构建前从 NuGet 拉取（Microsoft.Web.WebView2 包）
      - name: Download WebView2Loader.dll (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "webview2.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" -OutFile $pkg
          Expand-Archive -Path $pkg -DestinationPath (Join-Path $env:RUNNER_TEMP "webview2") -Force
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "webview2\runtimes\win-x64\native\WebView2Loader.dll") "src-tauri\resources\WebView2Loader.dll" -Force

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tauri)
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homedesktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*

      - name: Upload frontend bundle size report
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
