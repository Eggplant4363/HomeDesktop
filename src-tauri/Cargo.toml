[package]
name = "homedesktop"
version = "0.6.0"
description = "Cross-platform desktop launcher & smart-home dashboard (HomeDesktop)"
authors = ["HomeDesktop Contributors"]
edition = "2021"

[lib]
name = "homedesktop_lib"
# 桌面目标仅需 rlib（bin 目标链接生成 exe）。
# 注意：GNU 工具链下 cdylib 导出表会触发 "export ordinal too large"（WebView2 符号）；
# 移动端（iOS/Android）需要 staticlib/cdylib 时再加回。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
base64 = "0.22"
ureq = { version = "2", features = ["socks-proxy"] }
rustls = { version = "0.23", features = ["ring", "custom-provider"] }
homedesktop-core = { path = "../crates/homedesktop-core" }

# Windows 专用依赖：
# - winreg：非 Windows 直接 compile_error!（作者明确要求 target 门控）
# - windows 0.61：其依赖 windows-future 0.2.1 在非 Windows 编译失败（上游 bug，
#   imp::marshaler 无 cfg(windows) 保护）→ 必须仅 Windows 目标才拉入依赖树
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_Input_Ime",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }

